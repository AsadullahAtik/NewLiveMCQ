<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Live MCQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A7396">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Live MCQ">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column (header, scrolling main, 4-tab bar). Motif: an OMR answer sheet, with answer bubbles and timing marks. */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --ink:#0F1F2A; --muted:#5A6C78; --line:#E2E9EE;
  --accent:#0A7396; --accent-ink:#FFFFFF; --accent-soft:#E1F1F7; --accent-2:#13A0B8;
  --shadow:0 1px 2px rgba(15,31,42,.05),0 4px 14px rgba(15,31,42,.06); --shadow-lg:0 10px 30px rgba(15,31,42,.14);
  --good:#17794A; --good-soft:#DDF1E6; --bad:#B8392B; --bad-soft:#F8E2DE; --warn:#8A5700; --warn-soft:#FBEFD3;
  --scrim:rgba(8,18,22,.55);
  --f-display:"Baloo Da 2","Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  --f-body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#091217; --surface:#101D24; --ink:#E6EEF2; --muted:#8FA5B0; --line:#1F323B;
    --accent:#4DBBDC; --accent-ink:#04212A; --accent-soft:#12333F; --accent-2:#2A9DB8;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
    --good:#52C78C; --good-soft:#12352A; --bad:#F0786B; --bad-soft:#3A1E1B; --warn:#E6B54F; --warn-soft:#3A2D10;
    --scrim:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#091217; --surface:#101D24; --ink:#E6EEF2; --muted:#8FA5B0; --line:#1F323B;
  --accent:#4DBBDC; --accent-ink:#04212A; --accent-soft:#12333F; --accent-2:#2A9DB8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
  --good:#52C78C; --good-soft:#12352A; --bad:#F0786B; --bad-soft:#3A1E1B; --warn:#E6B54F; --warn-soft:#3A2D10;
  --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sp{flex:1}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:0}

/* type */
.h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1.2;text-wrap:balance}
.h1.xl{font-size:2.4rem;letter-spacing:-.01em}
.h1.sm{font-size:1.5rem}
.h2{font-family:var(--f-display);font-weight:700;font-size:1.1rem;line-height:1.3}
.eyebrow{color:var(--muted);font-weight:500;font-size:.9rem}
.lead{color:var(--muted);font-size:1.05rem}
.meta{color:var(--muted);font-size:.9rem}
.note{color:var(--muted);font-size:.85rem}

/* header, nav */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:8px}
.top-r{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.mark{color:var(--ink)}
.timing{height:6px;background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 11px);flex:none}
.page>*{flex:none}
.split{display:flex;flex-direction:column;gap:14px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.col>*{flex:none}
.cards3{display:flex;flex-direction:column;gap:14px}
.hdr-name{display:none}
.auth-l,.auth-r{display:flex;flex-direction:column;gap:18px;min-width:0}
.main{flex:1;min-height:0;overflow-y:auto;padding-block:16px 14px;-webkit-overflow-scrolling:touch}
.page{display:flex;flex-direction:column;gap:14px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-top:1px solid var(--line);padding-block:6px 8px;flex:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;padding:4px 2px;background:none;border:0;color:var(--muted);font-size:.74rem;font-weight:600;border-radius:12px}
.tab .ic{padding:3px 16px;border-radius:999px;display:grid;place-items:center}
.tab.on{color:var(--accent)}
.tab.on .ic{background:var(--accent-soft)}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}

/* basics */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.mute{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid transparent;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.sm{min-height:40px;padding:0 14px;font-size:.92rem}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loading,.empty{color:var(--muted);text-align:center;padding:28px 12px}
.empty{border:1.5px dashed var(--line);border-radius:14px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:600;font-size:.9rem}
input,select,textarea{width:100%;min-height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
textarea{padding:10px 12px;min-height:72px;resize:vertical}
form{display:flex;flex-direction:column;gap:12px}

/* OMR bubbles */
.bubble{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--muted);display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem;line-height:1}
.bubble.lg{width:46px;height:46px;font-size:1.3rem}
.bubble.sm{width:26px;height:26px;font-size:.8rem;border-width:1.5px}
.bubble.fill{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* auth */
.auth{flex:1;min-height:0;overflow-y:auto;padding-block:24px 28px;display:flex;flex-direction:column;gap:18px}
.auth-hero{display:flex;flex-direction:column;gap:8px}
.bubbles{display:flex;gap:10px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;border:0;background:transparent;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.foot{color:var(--muted);font-size:.82rem;text-align:center}

/* home / exam cards */
.hello{display:flex;flex-direction:column;gap:6px}
.exam h3{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.3}
.exam-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.scoreline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;color:var(--muted)}
.scoreline b{font-family:var(--f-display);font-size:1.6rem;color:var(--ink)}
.scoreline span{margin-left:auto;font-weight:600;color:var(--accent)}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pill{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;max-width:80%}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-display);font-size:1.7rem;line-height:1.1}
.tile span{color:var(--muted);font-size:.8rem}
.tile.warn{background:var(--warn-soft);border-color:transparent}
.tile.warn b,.tile.warn span{color:var(--warn)}
.btn-card{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}

/* leaderboard */
.board{padding:0;gap:0;overflow:hidden}
.board-h{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.me{background:var(--accent-soft)}
.rankb{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-body);font-weight:700;line-height:1;font-size:1.05rem}
.rankb.medal{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.who{flex:1;min-width:0;display:flex;flex-direction:column}
.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--muted);font-size:.8rem}
.score{text-align:right;display:flex;flex-direction:column;line-height:1.2}
.score b{font-family:var(--f-display);font-size:1.2rem}
.score small{color:var(--muted);font-size:.78rem}

/* overlays */
.ov{position:fixed;inset:0;z-index:30;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-in{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.ov-h{display:flex;align-items:center;gap:10px;padding-block:8px;flex:none}
.ov-h h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.ov-body{flex:1;min-height:0;overflow-y:auto;padding-block:10px 18px;display:flex;flex-direction:column;gap:14px}
.ov-foot{flex:none;padding-block:10px 12px;border-top:1px solid var(--line);display:grid;gap:10px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;color:var(--ink)}

/* exam taking */
.ex-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 8px}
.ex-top small{color:var(--muted);display:block;font-size:.8rem}
.ex-top b{font-family:var(--f-display);font-size:1.05rem;line-height:1.3}
.timer{font-family:var(--f-display);font-weight:800;font-size:1.3rem;padding:2px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--accent)}
.qno{color:var(--muted);font-weight:600;font-size:.9rem}
.qtext{font-size:1.2rem;line-height:1.55;font-weight:500;overflow-wrap:anywhere}
.qtext.sm{font-size:1rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bubble{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ex-foot{flex:none;border-top:1px solid var(--line);padding-block:10px 12px;display:flex;flex-direction:column;gap:10px}
.pal{display:flex;flex-wrap:wrap;gap:8px}
.pb{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:700}
.pb.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pb.cur{border-color:var(--ink);border-width:2.5px}
.link{background:none;border:0;color:var(--accent);font-weight:600;min-height:40px;text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:12px;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}

/* result */
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--line);stroke-width:8}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round}
.ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring-t b{font-family:var(--f-display);font-size:1.9rem}
.ring-t small{color:var(--muted)}
.rfacts{display:flex;flex-direction:column;gap:8px;min-width:0}
.rfacts div{display:flex;flex-direction:column;line-height:1.3}
.rfacts small{color:var(--muted);font-size:.8rem}
.rfacts b{font-family:var(--f-display);font-size:1.25rem}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.calc{font-size:.88rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.rv-h{display:flex;align-items:center;justify-content:space-between}
.qn{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.ro{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1.5px solid transparent}
.ro>span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.ro .tag{flex:none;font-size:.72rem;font-weight:700}
.ro.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.ro.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.bigok{width:84px;height:84px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center}
.center{align-items:center;text-align:center}

/* admin */
.q-ed{gap:10px}
.mono{font-family:var(--f-mono);font-size:.82rem}
.log{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.log .p{flex:1;min-width:0;overflow-wrap:anywhere}
.m{flex:none;font-family:var(--f-mono);font-weight:700;font-size:.72rem;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.m.POST,.m.PATCH{background:var(--warn-soft);color:var(--warn)}
.m.DELETE{background:var(--bad-soft);color:var(--bad)}
.stu-sel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}

.secrow{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.secrow .who small{display:block}
.chev{flex:none;color:var(--muted);display:grid;place-items:center}
.stand{display:flex;align-items:center;gap:14px;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px}
.stand-rank{flex:none;width:58px;height:58px;border-radius:50%;border:2.5px solid var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:1.6rem;line-height:1}
.stand-r{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.stand-r small{opacity:.9;font-size:.84rem}
.stand-r b{font-family:var(--f-display);font-size:1.5rem;line-height:1.2}
.stand-s{display:flex;flex-direction:column;text-align:right;line-height:1.25;flex:none;max-width:42%}
.stand-s b{font-family:var(--f-display);font-size:1.7rem;line-height:1.1}
.stand-s small{opacity:.9;font-size:.8rem}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:4px 0 0}
.pcol{flex:1;min-width:0;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pcol .nm{font-weight:600;font-size:.86rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.pcol .mk{font-family:var(--f-display);font-weight:800;font-size:1.2rem;line-height:1.1}
.pblock{width:100%;border-radius:12px 12px 0 0;background:var(--accent-soft);border:1px solid var(--line);border-bottom:0;display:flex;justify-content:center;padding-top:10px}
.pcol.first .pblock{background:var(--accent);border-color:var(--accent)}
.pblock .rankb{background:var(--surface);border-color:var(--line);color:var(--ink)}
.pcol.me .nm{color:var(--accent)}
.mbar{display:block;height:5px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent)}
.row .who small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700}
.secrow .who{flex:1;min-width:0}
.card.board>.secrow{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
.card.board>.secrow:last-child{border-bottom:0}
.stuline{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.stuline:last-of-type{border-bottom:0}
.stuline .sn{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stuline .sr{flex:none;color:var(--muted);font-size:.82rem}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:min(92vw,440px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.92rem;text-align:center}
.toast.good{background:var(--good);color:#fff}
.toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

/* ---------- tablet and desktop ---------- */
@media (hover:hover){
  .btn-card:hover,.secrow:hover,.stuline:hover,.opt:hover,.pill:hover,.pb:hover,.icon-btn:hover{border-color:var(--accent)}
  .tab:hover{background:var(--accent-soft)}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08)}
}
@media (min-width:640px) and (max-width:899.98px){

/* ---- simulated REST backend (runs inside the page) ---- */
function U(){return session?db.users.filter(function(u){return u.id===session.userId;})[0]:null;}
function clsOf(id){var c=db.classes.filter(function(x){return x.id===id;})[0];return c;}
function clsName(id){var c=clsOf(id);return c?c.name:'—';}
function pubUser(u){return {id:u.id,role:u.role,name:u.name,roll:u.roll,phone:u.phone||'',classId:u.classId||null,section:u.section||null,className:u.classId?clsName(u.classId):''};}
/* full marks = questions x per-question marks + the teacher's flat bonus, so no mark can exceed it */
function baseTotal(ex){return r2(ex.questions.length*ex.perQ);}
function total(ex){return r2(baseTotal(ex)+(ex.bonus||0));}
function evaluate(ex,ans){
  var c=0,w=0,b=0;
  ex.questions.forEach(function(q,i){var a=ans[i];if(a==null)b++;else if(a===q.ans)c++;else w++;});
  return {correct:c,wrong:w,blank:b,marks:Math.max(0,r2(c*ex.perQ-w*ex.neg))};
}
/* marks before any teacher bonus; attempt.marks = rawMarks + exam.bonus */
function rawMarks(ex,a){return Math.max(0,r2(a.correct*ex.perQ-a.wrong*ex.neg));}
/* equal marks and equal time share a rank; otherwise less time ranks higher */
function ranking(examId){
  var list=db.attempts.filter(function(a){return a.examId===examId;}).slice()
    .sort(function(a,b){return b.marks-a.marks||a.timeSec-b.timeSec;});
  var r=0;
  return list.map(function(a,i){
    var p=list[i-1];
    if(!(p&&p.marks===a.marks&&p.timeSec===a.timeSec))r=i+1;
    return Object.assign({},a,{rank:r});
  });
}
function rankRows(list){
  var r=0;
  return list.map(function(x,i){
    var p=list[i-1];
    if(!(p&&p.marks===x.marks&&p.timeSec===x.timeSec))r=i+1;
    return Object.assign({},x,{rank:r});
  });
}
function examSummary(ex,user){
  var att=db.attempts.filter(function(a){return a.examId===ex.id;});
  var o={id:ex.id,title:ex.title,classId:ex.classId,className:clsName(ex.classId),duration:ex.duration,perQ:ex.perQ,neg:ex.neg,
    qCount:ex.questions.length,total:total(ex),base:baseTotal(ex),published:ex.published,pubSeq:ex.pubSeq||0,attempts:att.length,bonus:ex.bonus||0};
  if(user&&user.role==='student'){
    var mine=att.filter(function(a){return a.userId===user.id;})[0];
    o.subOrder=mine?db.attempts.indexOf(mine):-1;
    o.state=mine?(ex.published?'published':'pending'):(ex.published?'missed':'open');
    if(mine&&ex.published){
      var rk=ranking(ex.id).filter(function(x){return x.userId===user.id;})[0];
      o.marks=mine.marks;o.rank=rk.rank;o.timeSec=mine.timeSec;o.participants=att.length;
    }
  }
  return o;
}

    if(!Number.isFinite(b.neg)||b.neg<0)return fail(422,'ভুল উত্তরে কাটা নম্বর শূন্য বা তার বেশি হবে');
    var qs=b.questions||[];
    if(!qs.length)return fail(422,'অন্তত একটি প্রশ্ন যোগ করুন');
    for(var i=0;i<qs.length;i++){
      var qq=qs[i];
      if(!(qq.q||'').trim()||(qq.opts||[]).some(function(o){return !(o||'').trim();}))return fail(422,'প্রশ্ন '+bn(i+1)+' এর লেখা ও চারটি অপশন পূরণ করুন');
    }
    db.exams.push({id:'e'+(++db.seq),title:title,classId:b.classId,duration:b.duration,perQ:b.perQ,neg:b.neg,published:false,
      questions:qs.map(function(x){return {q:x.q.trim(),opts:x.opts.map(function(o){return o.trim();}),ans:+x.ans||0};})});
    return ok({id:db.exams[db.exams.length-1].id});
  }
  if(mt('DELETE',/^\/api\/exams\/(\w+)$/)){
    if((g=needAdm()))return g;
    var id=r[1];
    db.exams=db.exams.filter(function(e){return e.id!==id;});
    db.attempts=db.attempts.filter(function(a){return a.examId!==id;});
    return ok({});
  }
  if(mt('POST',/^\/api\/exams\/(\w+)\/publish$/)){
    if((g=needAdm()))return g;
    var ex6=findExam(r[1]);if(!ex6)return fail(404,'পরীক্ষা পাওয়া যায়নি');
    if(!db.attempts.some(function(a){return a.examId===ex6.id;}))return fail(422,'কেউ উত্তরপত্র জমা দেয়নি, তাই প্রকাশ করা যাবে না');
    ex6.published=true;ex6.pubSeq=++db.seq;return ok({published:true});
  }
  if(mt('DELETE',/^\/api\/exams\/(\w+)\/publish$/)){
    if((g=needAdm()))return g;
    var ex7=findExam(r[1]);if(!ex7)return fail(404,'পরীক্ষা পাওয়া যায়নি');
    ex7.published=false;return ok({published:false});
  }
  /* one flat bonus for every participant (e.g. a question was wrong); 0 removes it. It is added to every attempt, so ranking updates too */
  if(mt('POST',/^\/api\/exams\/(\w+)\/bonus$/)){
    if((g=needAdm()))return g;
    var ex8=findExam(r[1]);if(!ex8)return fail(404,'পরীক্ষা পাওয়া যায়নি');
    var bv=b.bonus;
    if(typeof bv!=='number'||!Number.isFinite(bv)||bv<0||bv>100)return fail(422,'অতিরিক্ত নম্বর ০ থেকে ১০০ এর মধ্যে একটি সংখ্যা দিন');
    bv=r2(bv);
    var att8=db.attempts.filter(function(a){return a.examId===ex8.id;});
    if(!att8.length)return fail(422,'কেউ এই পরীক্ষায় অংশ নেয়নি, তাই নম্বর যোগ করা যাবে না');
    ex8.bonus=bv;
    att8.forEach(function(a){a.marks=r2(rawMarks(ex8,a)+bv);});
    return ok({bonus:bv,updated:att8.length});
  }
  if(mt('PATCH',/^\/api\/students\/(\w+)\/enrollment$/)){
    if((g=needAdm()))return g;
    var st=db.users.filter(function(x){return x.id===r[1]&&x.role==='student';})[0];
    var c2=clsOf(b.classId);
    if(!st||!c2||c2.sections.indexOf(b.section)<0)return fail(422,'শ্রেণি ও শাখা সঠিক নয়');
    st.classId=c2.id;st.section=b.section;return ok(pubUser(st));
  }
  if(mt('POST',/^\/api\/classes$/)){
    if((g=needAdm()))return g;
    var cn=(b.name||'').trim();
    if(cn.length<2)return fail(422,'শ্রেণির নাম লিখুন');
    if(db.classes.some(function(x){return x.name===cn;}))return fail(409,'এই নামে শ্রেণি আগেই আছে');
    db.classes.push({id:'c'+(++db.seq),name:cn,sections:['ক']});return ok({});
  }
  if(mt('POST',/^\/api\/classes\/(\w+)\/sections$/)){
    if((g=needAdm()))return g;
    var c3=clsOf(r[1]);var sn=(b.name||'').trim();
    if(!c3)return fail(404,'শ্রেণি পাওয়া যায়নি');
    if(!sn)return fail(422,'শাখার নাম লিখুন');
    if(c3.sections.indexOf(sn)>=0)return fail(409,'এই শাখা আগেই আছে');
    c3.sections.push(sn);return ok({});
  }
  return fail(404,'রুট পাওয়া যায়নি');
}
function api(method,path,body){
  var t0=performance.now();
  return new Promise(function(res){setTimeout(res,70+Math.random()*110);}).then(function(){
    var out;
    try{out=route(method,path,body||{});}catch(e){console.error(e);out={status:500,error:'সার্ভারে সমস্যা হয়েছে'};}
    apiLog.unshift({method:method,path:path,status:out.status,ms:Math.round(performance.now()-t0)});
    if(apiLog.length>40)apiLog.length=40;
    save();
    if(out.status>=400){var er=new Error(out.error||'ত্রুটি');er.status=out.status;throw er;}
    return out.data;
  });
}

/* ---------- data loading ---------- */
async function loadTab(){
  var tk=++S.tk,t=S.tab;
  try{
    var d=null;
    if(t==='home'||t==='results'){S.user=await api('GET','/api/me');d={exams:await api('GET','/api/exams')};}
    else if(t==='board'){
      var exams=await api('GET','/api/exams');
      var pubs=exams.filter(function(e){return e.published;}).sort(function(a,b){return b.pubSeq-a.pubSeq;});
      if(!pubs.some(function(e){return e.id===S.boardId;}))S.boardId=pubs[0]?pubs[0].id:null;
      d={exams:exams,board:(S.boardMode==='exam'&&S.boardId)?await api('GET','/api/exams/'+S.boardId+'/leaderboard'):null,overall:(S.boardMode==='overall'&&pubs.length)?await api('GET','/api/leaderboard/overall'):null};
    }
    else if(t==='profile'){S.user=await api('GET','/api/me');d={};}
    else if(t==='dash')d=await api('GET','/api/admin/summary');
    else if(t==='exams')d={exams:await api('GET','/api/admin/exams')};
    else if(t==='students')d={students:await api('GET','/api/admin/students'),classes:await api('GET','/api/classes')};
    else if(t==='classes')d={classes:await api('GET','/api/classes')};
    if(tk!==S.tk)return;
    S.data=d;render();
  }catch(e){
    if(tk!==S.tk)return;
    toast(e.message,'bad');
    if(e.status===401){S.user=null;render();}
  }
}
function go(t){S.tab=t;S.data=null;render();loadTab();}
var refresh=function(){return loadTab();};
function errToast(e){toast(e.message||'কিছু একটা সমস্যা হয়েছে','bad');}

async function doLogin(roll,pw){
  try{
    S.user=await api('POST','/api/auth/login',{roll:roll,password:pw});
    S.tab=S.user.role==='admin'?'dash':'home';S.data=null;S.overlay=null;render();loadTab();
  }catch(e){errToast(e);}
}

/* exam flow */
async function openIntro(id){
  try{var paper=await api('GET','/api/exams/'+id+'/paper');S.overlay={type:'intro',paper:paper};render();}
  catch(e){errToast(e);refresh();}
}
function startExam(){
  var p=S.overlay.paper,now=Date.now();
  S.ex={paper:p,idx:0,answers:p.questions.map(function(){return null;}),confirm:false,busy:false,startedAt:now,endAt:now+p.duration*60000,rem:p.duration*60};
  S.overlay={type:'exam'};render();
  clearInterval(S.tm);S.tm=setInterval(tick,500);
}
function tick(){
  var x=S.ex;if(!x)return;
  var rem=Math.max(0,Math.ceil((x.endAt-Date.now())/1000));x.rem=rem;
  var el=document.getElementById('timer');
  if(el){el.textContent=mmss(rem);el.classList.toggle('low',rem<=60);}
  if(rem<=0&&!x.busy)submitExam(true);
}
async function submitExam(auto){
  var x=S.ex;if(!x||x.busy)return;
  x.busy=true;x.confirm=false;clearInterval(S.tm);
  var timeSec=Math.min(x.paper.duration*60,Math.max(1,Math.round((Date.now()-x.startedAt)/1000)));
  try{
    await api('POST','/api/exams/'+x.paper.id+'/submit',{answers:x.answers,timeSec:timeSec});
    S.overlay={type:'submitted',title:x.paper.title,timeSec:timeSec,auto:!!auto};S.ex=null;render();refresh();
  }catch(e){errToast(e);S.ex=null;S.overlay=null;render();refresh();}
}
async function openResult(id){
  try{var r=await api('GET','/api/results/'+id);S.overlay={type:'result',r:r};render();}catch(e){errToast(e);}
}
async function openReview(id){
  try{var b=await api('GET','/api/exams/'+id+'/leaderboard');S.overlay={type:'review',b:b};render();}catch(e){errToast(e);}
}
async function openAdminExam(id){
  try{var d=await api('GET','/api/admin/exams/'+id);S.armed=null;S.overlay={type:'adminExam',exam:d.exam,questions:d.questions};render();}catch(e){errToast(e);}
}

/* editor */
var blankQ=function(){return {q:'',opts:['','','',''],ans:0};};
function capture(){
  var d=S.draft;if(!d)return;
  var g=function(id){return document.getElementById(id);};
  if(!g('ed-title'))return;
  d.title=g('ed-title').value;d.classId=g('ed-class').value;d.duration=g('ed-dur').value;d.perQ=g('ed-perq').value;d.neg=g('ed-neg').value;
  d.questions.forEach(function(q,i){
    q.q=g('ed-q-'+i).value;
    q.opts=q.opts.map(function(_,j){return g('ed-o-'+i+'-'+j).value;});
    q.ans=+g('ed-a-'+i).value;
  });
}
async function openEditor(){
  try{
    S.classes=await api('GET','/api/classes');
    S.draft={title:'',classId:S.classes[0].id,duration:'5',perQ:'1',neg:'0.25',questions:[blankQ()]};
    S.overlay={type:'editor'};render();
  }catch(e){errToast(e);}
}
async function saveExam(){
  capture();var d=S.draft;
  var body={title:d.title,classId:d.classId,duration:parseInt(asc(d.duration),10),perQ:parseFloat(asc(d.perQ)),neg:parseFloat(asc(d.neg)||'0'),questions:d.questions};
  try{await api('POST','/api/exams',body);S.overlay=null;S.draft=null;render();toast('পরীক্ষা তৈরি হয়েছে','good');refresh();}
  catch(e){errToast(e);}
}

/* ---------- events ---------- */
var A={
  demoStudent:function(){doLogin('250112','1234');},
  demoAdmin:function(){doLogin('admin','admin');},
  authMode:function(t){S.authMode=t.dataset.m;render();},
  tab:function(t){go(t.dataset.tab);},
  intro:function(t){openIntro(t.dataset.id);},
  startExam:startExam,
  pick:function(t){var x=S.ex,j=+t.dataset.j;x.answers[x.idx]=x.answers[x.idx]===j?null:j;render();},
  qnav:function(t){S.ex.idx=+t.dataset.i;render();},
  prev:function(){if(S.ex.idx>0){S.ex.idx--;render();}},
  next:function(){if(S.ex.idx<S.ex.paper.questions.length-1){S.ex.idx++;render();}},
  askSubmit:function(){S.ex.confirm=true;render();},
  cancelSubmit:function(){S.ex.confirm=false;render();},
  doSubmit:function(){submitExam(false);},
  close:function(){S.overlay=null;S.armed=null;render();refresh();},
  result:function(t){openResult(t.dataset.id);},
  toBoard:function(t){S.boardMode='exam';S.boardId=t.dataset.id;S.overlay=null;S.tab='board';S.data=null;render();loadTab();},
  boardMode:function(t){S.boardMode=t.dataset.m;S.data=null;render();loadTab();},
  openSection:async function(t){
    try{var d=await api('GET','/api/admin/classes/'+t.dataset.cid+'/sections/'+encodeURIComponent(t.dataset.sec)+'/students');S.overlay={type:'section',d:d};render();}catch(e){errToast(e);}
  },
  openStudent:async function(t){
    try{
      var r=await api('GET','/api/admin/students/'+t.dataset.id+'/report'),cl=await api('GET','/api/classes');
      S.overlay={type:'stuReport',r:r,classes:cl,from:S.overlay&&S.overlay.type==='section'?S.overlay:null};render();
    }catch(e){errToast(e);}
  },
  stuBack:function(){var f=S.overlay.from;S.overlay=f||null;render();if(!f)refresh();},
  /* open one student's answer sheet from the review list or from a student's report; "back" returns to where it was opened */
  openAttempt:async function(t){
    try{
      var d=await api('GET','/api/admin/exams/'+t.dataset.eid+'/attempts/'+t.dataset.uid);
      S.overlay={type:'attempt',d:d,from:S.overlay};render();
    }catch(e){errToast(e);}
  },
  attBack:function(){var f=S.overlay.from;S.overlay=f||null;render();if(!f)refresh();},
  boardSel:function(t){S.boardId=t.dataset.id;S.data=null;render();loadTab();},
  review:function(t){openReview(t.dataset.id);},
  publish:async function(t){
    try{await api('POST','/api/exams/'+t.dataset.id+'/publish');toast('ফলাফল প্রকাশিত হয়েছে','good');await openReview(t.dataset.id);refresh();}catch(e){errToast(e);}
  },
  unpublish:async function(t){
    try{await api('DELETE','/api/exams/'+t.dataset.id+'/publish');toast('প্রকাশ প্রত্যাহার করা হয়েছে');await openReview(t.dataset.id);refresh();}catch(e){errToast(e);}
  },
  adminExam:function(t){openAdminExam(t.dataset.id);},
  delExam:async function(t){
    var key='del:'+t.dataset.id;
    if(S.armed!==key){S.armed=key;render();return;}
    try{await api('DELETE','/api/exams/'+t.dataset.id);S.armed=null;S.overlay=null;render();toast('পরীক্ষা মুছে ফেলা হয়েছে');refresh();}catch(e){errToast(e);}
  },
  newExam:openEditor,
  edAdd:function(){capture();S.draft.questions.push(blankQ());render();setTimeout(function(){var b=document.querySelector('.ov-body');if(b)b.scrollTop=b.scrollHeight;},0);},
  edRemove:function(t){capture();S.draft.questions.splice(+t.dataset.i,1);render();},
  edSave:saveExam,
  settings:function(){S.armed=null;S.overlay={type:'settings'};render();},
  apilog:function(){S.overlay={type:'apilog'};render();},
  reset:async function(){
    if(S.armed!=='reset'){S.armed='reset';render();return;}
    try{await api('POST','/api/dev/reset');}catch(e){}
    apiLog=[];S.user=null;S.overlay=null;S.armed=null;S.data=null;S.authMode='login';S.boardId=null;
    try{S.classes=await api('GET','/api/classes');}catch(e){}
    render();toast('ডেমো ডেটা আগের অবস্থায় ফিরেছে','good');
  },
  logout:async function(){
    try{await api('POST','/api/auth/logout');}catch(e){}
    S.user=null;S.overlay=null;S.data=null;S.armed=null;S.authMode='login';render();
  }
};
var FORMS={
  login:function(f){doLogin(f.elements.roll.value,f.elements.password.value);},
  register:async function(f){
    var v=function(n){return f.elements[n].value;};
    try{
      S.user=await api('POST','/api/auth/register',{name:v('name'),roll:v('roll'),password:v('password'),classId:v('classId'),section:v('section')});
      S.tab='home';S.data=null;render();toast('অ্যাকাউন্ট তৈরি হয়েছে','good');loadTab();
    }catch(e){errToast(e);}
  },
  profile:async function(f){
    try{S.user=await api('PATCH','/api/users/me',{name:f.elements.name.value,phone:f.elements.phone.value});render();toast('প্রোফাইল সংরক্ষিত হয়েছে','good');}catch(e){errToast(e);}
  },
  bonus:async function(f){
    var raw=asc(f.elements.bonus.value).trim()||'0',v=Number(raw);
    if(!Number.isFinite(v)){toast('অতিরিক্ত নম্বর হিসেবে একটি সংখ্যা লিখুন','bad');return;}
    try{
      var res=await api('POST','/api/exams/'+f.dataset.id+'/bonus',{bonus:v});
      await openReview(f.dataset.id);
      toast(res.bonus>0?'সবাইকে '+num(res.bonus)+' নম্বর অতিরিক্ত দেওয়া হয়েছে':'অতিরিক্ত নম্বর বাদ দেওয়া হয়েছে','good');
      refresh();
    }catch(e){errToast(e);}
  },
  enroll:async function(f){
    try{
      await api('PATCH','/api/students/'+f.dataset.id+'/enrollment',{classId:f.elements.classId.value,section:f.elements.section.value});
      var o=S.overlay;o.r=await api('GET','/api/admin/students/'+f.dataset.id+'/report');o.from=null;render();toast('শ্রেণি ও শাখা বদলানো হয়েছে','good');
    }catch(e){errToast(e);}
  },
  newClass:async function(f){
    try{await api('POST','/api/classes',{name:f.elements.name.value});toast('শ্রেণি যোগ হয়েছে','good');refresh();}catch(e){errToast(e);}
  },
  addSection:async function(f){
    try{await api('POST','/api/classes/'+f.dataset.id+'/sections',{name:f.elements.name.value});toast('শাখা যোগ হয়েছে','good');refresh();}catch(e){errToast(e);}
  }
};
var CHG={
  regClass:function(t){
    var c=S.classes.filter(function(x){return x.id===t.value;})[0];
    t.form.elements.section.innerHTML=c.sections.map(function(s){return '<option>'+esc(s)+'</option>';}).join('');
  },
  enrClass:function(t){
    var c=S.overlay.classes.filter(function(x){return x.id===t.value;})[0];
    t.form.elements.section.innerHTML=c.sections.map(function(x){return '<option>'+esc(x)+'</option>';}).join('');
  }
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t||t.disabled)return;
  var f=A[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('keydown',function(e){
  var x=S.ex;if(!x||!S.overlay||S.overlay.type!=='exam'||x.confirm||e.ctrlKey||e.metaKey||e.altKey)return;
  var t=e.target&&e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  var n=x.paper.questions.length,k=e.key,j=-1;
  if(k>='1'&&k<='4')j=+k-1;
  else{var m=asc(k);if(m>='1'&&m<='4')j=+m-1;}
  if(j>=0&&j<x.paper.questions[x.idx].opts.length){x.answers[x.idx]=x.answers[x.idx]===j?null:j;render();e.preventDefault();}
  else if(k==='ArrowRight'&&x.idx<n-1){x.idx++;render();e.preventDefault();}
  else if(k==='ArrowLeft'&&x.idx>0){x.idx--;render();e.preventDefault();}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();var h=FORMS[f.dataset.form];if(h)h(f);
});
document.addEventListener('change',function(e){
  var t=e.target;if(t.dataset&&t.dataset.chg&&CHG[t.dataset.chg])CHG[t.dataset.chg](t);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='stuSearch'){
    var v=asc(t.value).trim().toLowerCase();
    var shown=0;
    document.querySelectorAll('.stu').forEach(function(el){var h=!!v&&el.dataset.s.indexOf(v)<0;el.hidden=h;if(!h)shown++;});
    var ns=document.getElementById('noStu');if(ns)ns.hidden=shown>0;
  }
});

async function init(){
  loadDb();
  try{S.classes=await api('GET','/api/classes');}catch(e){}
  if(session){
    try{S.user=await api('GET','/api/me');S.tab=S.user.role==='admin'?'dash':'home';}catch(e){S.user=null;}
  }
  render();
  if(S.user)loadTab();
}
init();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
</script>
